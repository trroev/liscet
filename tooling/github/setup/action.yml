name: 'Setup and install'
description: 'Common setup steps for CI jobs'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    # `cache: pnpm` caches the pnpm content-addressable store keyed on the
    # lockfile — that is the install-time speedup. On a warm store,
    # `pnpm install --frozen-lockfile` does no network work and just links
    # packages into node_modules. We deliberately do NOT cache node_modules
    # itself: in a pnpm monorepo it is a large web of symlinks plus the .pnpm
    # virtual store, and its cache-save Post step contends across the six
    # parallel jobs (measured: it stalls CI). Store cache + --prefer-offline is
    # the correct, contention-free speedup.
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        check-latest: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
